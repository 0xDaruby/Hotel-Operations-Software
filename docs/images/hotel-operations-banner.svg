    <circle cx="64" cy="73" r="6" fill="#846044"/>
    <text x="64" y="143" text-anchor="middle" font-family="Georgia, serif" font-size="48" fill="#3D392F">101</text>
    <path d="M33 164H95" stroke="#D9CBB9"/>
    <text x="64" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#526047">READY</text>
