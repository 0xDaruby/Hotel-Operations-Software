  <text x="60" y="169" font-family="Georgia, serif" font-size="64" fill="#3D392F">Know your rooms.</text>
  <text x="60" y="242" font-family="Georgia, serif" font-size="64" fill="#3D392F">Run your day.</text>
  <text x="64" y="300" font-family="Arial, sans-serif" font-size="20" fill="#695640">Front desk · Room readiness · Owner oversight</text>
