<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Hotel Operations</title>
  <desc id="desc">Know your rooms. Run your day. A warm paper and sage banner with an illustrated room key.</desc>
